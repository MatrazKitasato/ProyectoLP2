<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayni - Panel del comedor receptor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="receptor.js"></script>
</head>
<body class="tema--receptor">
  <header class="encabezado">
    <div class="encabezado__marca">
      <span class="encabezado__icono" aria-hidden="true"></span>
      <div>
        <h1>Ayni</h1>
        <p class="encabezado__subtitulo">Panel del comedor receptor</p>
      </div>
      <a class="encabezado__volver" href="index.html">↺ Cambiar de rol</a>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo-comedor">
      <h2 id="titulo-comedor"><span class="titulo__icono"></span> ¿Cuál es tu comedor u olla común?</h2>
      <div class="campo">
        <label for="select-comedor">Comedor</label>
        <select id="select-comedor"></select>
      </div>
    </section>

    <section class="tarjeta tarjeta--destacada" aria-labelledby="titulo-disponibles">
      <h2 id="titulo-disponibles"><span class="titulo__icono"></span> Excedentes disponibles</h2>
      <ul id="lista-publicaciones" class="lista-publicaciones"></ul>
      <p id="mensaje-error" class="mensaje-error" role="alert"></p>
    </section>
  </main>
  <footer class="pie">
    <div class="pie__contenido">
      <p class="pie__marca">Ayni</p>
      <p class="pie__copyright">© 2026 Ayni. Todos los derechos reservados.</p>
      <a href="#" class="pie__contacto">Contáctanos</a>
      <div class="pie__redes">
        <a href="#" aria-label="Facebook">FB</a>
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="TikTok">TT</a>
        <a href="#" aria-label="WhatsApp">W</a>
      </div>
    </div>
  </footer>
</body>
</html>
