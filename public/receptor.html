<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayni - Panel del comedor receptor</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="modal.js"></script>
  <script defer src="receptor.js"></script>
</head>
<body>
  <header class="encabezado">
    <div class="encabezado__marca">
      <div>
        <h1>Ayni</h1>
        <p class="encabezado__subtitulo">Panel del comedor receptor</p>
      </div>
      <a class="encabezado__volver" href="index.html">↺ Cambiar de rol</a>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo-comedor">
      <h2 id="titulo-comedor">¿Cuál es tu comedor u olla común?</h2>
      <div class="campo">
        <label for="select-comedor">Comedor</label>
        <select id="select-comedor" aria-describedby="error-comedor"></select>
        <span id="error-comedor" class="campo__error" role="alert"></span>
      </div>
    </section>

    <section class="tarjeta tarjeta--destacada" aria-labelledby="titulo-disponibles">
      <h2 id="titulo-disponibles">Excedentes disponibles</h2>
      <ul id="lista-publicaciones" class="lista-publicaciones"></ul>
      <p id="mensaje-error" class="mensaje-error" role="alert"></p>
    </section>
  </main>

  <footer class="pie">
    <div class="pie__contenido">
      <p class="pie__marca">Ayni</p>
      <p class="pie__copyright">© 2026 Ayni. Todos los derechos reservados.</p>
      <a href="index.html#contacto" class="pie__contacto">Contáctanos</a>
      <div class="pie__redes">
        <a href="#">Fb</a>
        <a href="#">Ig</a>
        <a href="#">Tt</a>
        <a href="#">Wspp</a>
      </div>
    </div>
  </footer>
</body>
</html>
